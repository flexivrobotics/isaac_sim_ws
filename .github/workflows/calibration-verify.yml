name: Calibration verification

# Regression test for the RDK-to-USD calibration tools. Runs in a plain Python
# environment (no Isaac Sim, no robot): it validates the example calibrated
# kinematics YAMLs, applies the example calibrations to the in-repo rizon_4s and
# enlight_ll assets, and cross-checks each result against its reference
# calibrated URDF by forward kinematics.

on:
  push:
    paths:
      - "tools/calibration/**"
      - "exts/isaacsim.robot.manipulators.examples/data/flexiv/rizon_4s/**"
      - "exts/isaacsim.robot.manipulators.examples/data/flexiv/enlight_ll/**"
      - ".github/workflows/calibration-verify.yml"
  pull_request:
    paths:
      - "tools/calibration/**"
      - "exts/isaacsim.robot.manipulators.examples/data/flexiv/rizon_4s/**"
      - "exts/isaacsim.robot.manipulators.examples/data/flexiv/enlight_ll/**"
      - ".github/workflows/calibration-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/calibration/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip usd-core numpy pyyaml

      - name: Run calibration verification
        run: python run_ci_verification.py
