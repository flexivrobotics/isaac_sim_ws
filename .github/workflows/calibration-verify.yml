name: Calibration verification

# Regression test for the calibration code the bridge app and the export tool
# share. Runs in a plain Python environment (no Isaac Sim, no robot): it
# validates the example calibrated kinematics YAMLs, applies the example
# calibrations to the in-repo rizon_4s and enlight_ll assets, both saved into a
# copy and as overrides on a stage, and cross-checks each result against its
# reference calibrated URDF by forward kinematics.

on:
  push:
    paths:
      - "tools/calibration/**"
      - "flexiv_isaac/calibration.py"
      - "flexiv_isaac/kinematics_sync.py"
      - "assets/rizon_4s/**"
      - "assets/enlight_ll/**"
      - ".github/workflows/calibration-verify.yml"
  pull_request:
    paths:
      - "tools/calibration/**"
      - "flexiv_isaac/calibration.py"
      - "flexiv_isaac/kinematics_sync.py"
      - "assets/rizon_4s/**"
      - "assets/enlight_ll/**"
      - ".github/workflows/calibration-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/calibration/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip usd-core numpy pyyaml

      - name: Run calibration verification
        run: python run_ci_verification.py
