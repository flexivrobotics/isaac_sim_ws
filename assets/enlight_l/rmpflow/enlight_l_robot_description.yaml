# Modified by Flexiv Ltd., 2026: adapted from Isaac Sim's flexiv_rizon4_robot_description.yaml
# (isaacsim.robot_motion.motion_generation, motion_policy_configs/Flexiv/rizon4/rmpflow)
# for the Enlight L: root_link and default_q, and without the Rizon 4 collision spheres.
#
# Lula robot description of the Flexiv Enlight L, for RMPflow (see enlight_l.urdf).

api_version: 1.0

# Joints RMPflow controls, in the order of the articulation
cspace:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7

root_link: base_link

# Home pose [rad], from flexiv_description config/Enlight-L/initial_positions.yaml
default_q: [0.0, -0.69813, 0.0, 1.570796, 0.0, -0.872665, 0.0]

acceleration_limits: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
jerk_limits: [10000.0, 10000.0, 10000.0, 10000.0, 10000.0, 10000.0, 10000.0]
