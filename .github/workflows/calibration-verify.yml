name: Calibration verification

# Regression test for the RDK-to-USD calibration tools. Runs in a plain Python
# environment (no Isaac Sim, no robot): it validates the example calibrated
# kinematics YAML, applies the example calibration to the in-repo Rizon4s asset,
# and cross-checks the result against the reference calibrated URDF by forward
# kinematics.

on:
  push:
    paths:
      - "tools/calibration/**"
      - "exts/isaacsim.robot.manipulators.examples/data/flexiv/Rizon4s/**"
      - ".github/workflows/calibration-verify.yml"
  pull_request:
    paths:
      - "tools/calibration/**"
      - "exts/isaacsim.robot.manipulators.examples/data/flexiv/Rizon4s/**"
      - ".github/workflows/calibration-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/calibration/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip usd-core numpy pyyaml

      - name: Run calibration verification
        run: python run_ci_verification.py
